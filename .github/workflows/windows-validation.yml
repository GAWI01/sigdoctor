name: Controlled Windows validation
on:
  push:
    branches: [codex/powershell-slice]
    paths:
      - .github/workflows/windows-validation.yml
      - validation/controlled_windows.py
      - src/sigdoctor/**
      - tests/**
permissions:
  contents: read
jobs:
  controlled-states:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install existing package and test dependencies
        shell: cmd
        run: |
          python -m pip install -r requirements-dev.lock
          if errorlevel 1 exit /b 1
          python -m pip install --no-deps -e .
      - name: Verify before controlled states
        shell: cmd
        run: |
          python -m pytest -q
          if errorlevel 1 exit /b 1
          python -m ruff check .
          if errorlevel 1 exit /b 1
          python -m ruff format --check .
          if errorlevel 1 exit /b 1
          python -m mypy src
          if errorlevel 1 exit /b 1
          python -m build
      - name: Validate real Windows states and rollback
        shell: cmd
        run: python validation/controlled_windows.py --disposable-github-runner
      - name: Upload metadata-only validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-windows-validation
          path: validation-output/controlled-windows.json
          if-no-files-found: warn
          retention-days: 7
